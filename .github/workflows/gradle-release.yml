name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Read VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '\n')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "App Version: $VERSION"
      
      - name: Update versionName in build.gradle
        run: |
          sed -i "s/versionName \".*\"/versionName \"${{ env.VERSION }}\"/" app/build.gradle
      
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
      
      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace
      
      - name: Rename APK files
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/app-debug.apk release-apks/ebook-reader-v${{ env.VERSION }}-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-apks/ebook-reader-v${{ env.VERSION }}-release-unsigned.apk || \
          cp app/build/outputs/apk/release/app-release.apk release-apks/ebook-reader-v${{ env.VERSION }}-release.apk
      
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: release-apks/*-debug.apk
          retention-days: 30
      
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: release-apks/*-release*.apk
          retention-days: 30
      
      - name: Get commit message
        id: commit
        run: |
          echo "MESSAGE=$(git log -1 --pretty=%B | head -n 1)" >> $GITHUB_ENV
      
      - name: Create/Update Latest Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: Ebook Reader v${{ env.VERSION }}
          files: release-apks/*.apk
          body: |
            ## 📱 Ebook Reader App v${{ env.VERSION }}
            
            ### 📥 Download
            Choose the APK that suits your needs:
            - **Debug APK**: For testing and development
            - **Release APK**: Optimized build for production use
            
            ### 📦 Installation
            1. Download the APK file to your Android device
            2. Go to Settings → Security → Enable "Install from Unknown Sources"
            3. Open the downloaded APK and install
            
            ### 📝 Latest Changes
            ${{ env.MESSAGE }}
            
            **Build Date**: ${{ github.event.head_commit.timestamp }}
            **Commit**: [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            
            ---
            
            ### ✨ Features
            - 📚 Search and download ebooks from OceanOfPDF
            - 📖 Browse books by genre
            - 💾 Automatic download management
            - 🔍 Smart search filters
            - 📱 Material Design UI
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
