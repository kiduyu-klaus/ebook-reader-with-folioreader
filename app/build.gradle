plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.kiduyu.klaus.ebookfinaldownload'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.kiduyu.klaus.ebookfinaldownload"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }


    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding  true
        //noinspection DataBindingWithoutKapt
    }
    lintOptions {
        disable 'MissingTranslation'
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation project(':folioreader')
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation libs.jackson.core
    implementation libs.jackson.annotations
    implementation libs.jackson.databind
    implementation libs.jackson.module.kotlin

    // Add these lines for OkHttp and core-progress
    implementation libs.okhttp
    implementation libs.coreprogress

    implementation 'org.jsoup:jsoup:1.21.2'

    implementation libs.glide
    annotationProcessor libs.compiler

    // https://mvnrepository.com/artifact/androidx.swiperefreshlayout/swiperefreshlayout
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
}